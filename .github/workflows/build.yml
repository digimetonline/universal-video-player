name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the rest of the project (android/ etc.)
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --org com.dailycome --project-name universal_video_player
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Add INTERNET permission
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Raise compileSdk to 36 and set minSdk 24
        run: |
          f=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n1)
          echo "Patching $f"
          sed -i -E 's/^([[:space:]]*)compileSdk(Version)?[[:space:]]*(=)?[[:space:]]*.*$/\1compileSdk = 36/' "$f"
          sed -i -E 's/^([[:space:]]*)minSdk(Version)?[[:space:]]*(=)?[[:space:]]*.*$/\1minSdk = 24/' "$f"
          grep -n "compileSdk\|minSdk" "$f"

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
