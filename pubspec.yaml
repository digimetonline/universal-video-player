name: universal_video_player
description: Universal video player for Android - plays any file or network stream.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.3.6
  wakelock_plus: ^1.2.0
  file_picker: ^8.0.0
  shared_preferences: ^2.2.0

flutter:
  uses-material-design: true
